<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#1b6fc2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(180deg, #eef6ff, #dbeaff);
      color: #123;
    }
    .card {
      background: rgba(255,255,255,.86); backdrop-filter: blur(8px);
      border: 1px solid rgba(18,58,94,.12); border-radius: 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,.10); padding: 28px; width: min(92vw, 760px);
    }
    .row { display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
    .row img { width: 180px; height:180px; border-radius: 40px; }
    code { background: rgba(13,81,165,.08); padding: .15rem .35rem; border-radius: 6px; }
    ul { margin-top: .6rem; }
    .v { display:inline-block; font-size:.86rem; padding:.2rem .55rem; border-radius:999px; background:#0e56aa; color:#fff; }
  </style>
</head>
<body>
  <main class="card">
    <div class="row">
      <img src="icon-512.png" alt="Blue and white globe icon">
      <div>
        <div class="v">v18.7</div>
        <h1>Genealogy Map icon package</h1>
        <p>This is a drop-in icon asset pack for your app.</p>
        <ul>
          <li>Use <code>apple-touch-icon.png</code> for iPhone home-screen shortcuts.</li>
          <li>Use <code>head-snippet-v18.7.html</code> to patch your real <code>&lt;head&gt;</code>.</li>
          <li>Remove and re-add the shortcut if iPhone clings to the old icon.</li>
        </ul>
      </div>
    </div>
  </main>
</body>
